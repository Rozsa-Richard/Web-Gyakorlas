<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            margin: auto;
            width: 380px;
            text-align: center;
            border: 1px solid rgb(182, 179, 179);
            border-radius: 5px;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }
        h4 {
            margin: 0px;
            padding: 8px;
            background-color: rgb(233, 231, 231);
        }
        button {
            background-color: black;
            color: white;
            width: 300px;
            margin-top: 0px;
            margin-bottom: 10px;
            
            font-size: larger;
            border-radius: 5px;
        }
        h1 {
            margin: 0px;
            padding-top: 10px;
            border-top: 1px solid rgb(182, 179, 179);
        }
        span {
            color: gray;
            font-size: smaller;
        }
        p {
            font-weight: bold;
            font-size: smaller;
        }
    </style>
</head>
<body>
    <div class="box">
        <h4>Labrador</h4>
        <h1>$15<span>/mo</span></h1>
        <p>
            Unlimited Matches <br>
            Unlimited Messages <br>
            Unlimited App Usage <br>
        </p>
        <button>Get started</button>
    </div>
</body>
</html>
