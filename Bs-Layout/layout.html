<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container border" style="height: 30vh;">
        <div class="row m-2 border">
            <div class="col m-2 border">
                Column1
            </div>

            <div class="col m-2 border">
                Column2
            </div>

            <div class="col m-2 border">
                Column3
            </div>
        </div>
    </div>

    <div class="container bg-info text-light border" style="height: 30vh;">
        <div class="row m-2">
            <div class="col bg-primary m-2">
                Column1
            </div>

            <div class="col bg-primary m-2">
                Column2
            </div>

            <div class="col bg-primary m-2">
                Column3
            </div>
        </div>
    </div>
    
    <div class="container mt-2 border overflow-auto" style="height: 30vh;">
        <div class="row m-2 border">
            <div class="col-lg m-2 border">
                Column1
            </div>

            <div class="col-lg m-2 border">
                Column2
            </div>

            <div class="col-lg m-2 border">
                Column3
            </div>
        </div>

        <div class="row m-2 border">
            <div class="col-xl m-2 border">
                Column1
            </div>

            <div class="col-xl m-3 border">
                Column2
            </div>

            <div class="col-xl m-4 border">
                Column3
            </div>
        </div>
    </div>

    <div class="container border bg-secondary mt-2" style="height: 30vh;">
        <div class="row bg-danger text-light m-2">
            <div class="col-md m-2 bg-primary">
                Column1
            </div>
            <div class="col-md m-2 bg-success">
                Column2
            </div>
            <div class="col-md m-2 bg-primary">
                Column3
            </div>
        </div>

        <div class="row bg-warning text-dark m-2">
            <div class="col-xl m-2 bg-info">
                Column1
            </div>
            <div class="col-xl m-2 bg-success">
                Column2
            </div>
            <div class="col-xl m-2 bg-info">
                Column3
            </div>
        </div>
    </div>
</body>
</html>
