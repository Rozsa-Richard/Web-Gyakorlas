<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap elrendezés</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <style>
        .page-padding {
            padding: 20px; 
        }

        .topbar {
            background-color: #e31b23;
            height: 70px;
        }

        .layout-gap {
            gap: 20px;
        }

        .sidebar {
            background-color: #00a2e8;
            min-height: 500px;
        }

        .content {
            background-color: #2bb34a;
            min-height: 500px;
        }

        .placeholder {
            background-color: #cfcfcf;
            height: 30px;
        }
    </style>
</head>
<body>

<div class="page-padding">

    <nav class="topbar d-flex align-items-center px-4 mb-4">
        <div class="d-flex gap-3">
            <div class="placeholder px-4"></div>
            <div class="placeholder px-4"></div>
            <div class="placeholder px-4"></div>
            <div class="placeholder px-4"></div>
        </div>
    </nav>

    <div class="container-fluid p-0 ">
        <div class="row layout-gap">

            <aside class="col-2 sidebar p-3">
                <div class="d-flex flex-column gap-3">
                    <div class="placeholder"></div>
                    <div class="placeholder"></div>
                    <div class="placeholder"></div>
                    <div class="placeholder"></div>
                    <div class="placeholder"></div>
                    <div class="placeholder"></div>
                </div>
            </aside>

            <main class="col content d-flex justify-content-center align-items-center">
                <div class="bg-secondary" style="width:60%; height:200px;"></div>
            </main>

        </div>
    </div>

</div>

</body>
</html>
